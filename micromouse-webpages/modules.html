<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">

<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1">
    <title>Micromouse Module</title>
    <link rel="icon" href="./assets/images/mm_general/mm_logo_whitemaze.PNG">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" href="./css/custom.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
        integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sheet-content {
            max-width: 960px;
        }

        .sheet-block {
            margin-bottom: 3rem;
        }

        .sheet-block--split {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 2rem;
            align-items: center;
        }

        .sheet-block__image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .sheet-block__caption {
            margin-bottom: 0.5rem;
        }

        @media (max-width: 767.98px) {
            .sheet-block--split {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>
    <script src="./js/mm_header.js"></script>

    <main class="container-xl my-5 sheet-content">
        <h1 id="sheet-title" class="fw-bold mt-5 mb-5 text-center">Loading...</h1>
        <div id="sheet-status" class="text-center" role="status"></div>
        <section id="sheet-content" aria-live="polite"></section>
    </main>

    <script type="module" src="./js/module-page.js"></script>
    <script src="./js/mm_footer.js"></script>
</body>

</html>
